<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDG & Poverty Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#17212b; --muted:#5d6b78; --line:#dde3e9; --accent:#0b6e8a; --accent2:#e8f4f7;
  --g:#2e9d5b; --y:#e6b800; --o:#f08a24; --r:#d64545; --n:#c9d1d8; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171d; --card:#1a222b; --text:#e6edf3; --muted:#9aa8b5; --line:#2c3743; --accent:#3fb3d3; --accent2:#173340;
    --n:#3a4652; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hwrap{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.brand .dot{width:28px;height:28px;border-radius:50%;background:conic-gradient(#E5243B,#DDA63A,#4C9F38,#C5192D,#FF3A21,#26BDE2,#FCC30B,#A21942,#FD6925,#DD1367,#FD9D24,#BF8B2E,#3F7E44,#0A97D9,#56C02B,#00689D,#19486A,#E5243B)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--text);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
h2{margin:0 0 4px;font-size:20px}
h3{margin:0;font-size:16px}
.muted{color:var(--muted);font-size:13.5px;margin:0}
.status{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px}
.status b{color:var(--text)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:120px;display:none}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
input[type=text],input[type=number],select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
input[type=number]{width:70px;padding:5px 8px}
select{padding:5px 8px}
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}
.tablebox.tall{max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;border-bottom:2px solid var(--line)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent2)}
tbody tr.picked{background:var(--accent2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cell{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;color:#fff}
.cell.g{background:var(--g)}.cell.y{background:var(--y);color:#222}.cell.o{background:var(--o)}.cell.r{background:var(--r)}.cell.n{background:var(--n);color:var(--muted);font-weight:400}
.mini{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:2px;vertical-align:middle}
.mini.g{background:var(--g)}.mini.y{background:var(--y)}.mini.o{background:var(--o)}.mini.r{background:var(--r)}.mini.n{background:var(--n)}
tr.dimrow td{background:var(--accent2);font-weight:600}
tr.idxrow td{font-weight:700;font-size:14px}
td.indname{white-space:normal;min-width:260px;max-width:420px;padding-left:24px}
td.dimname{white-space:normal;min-width:260px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.picker{position:relative;max-width:560px}
.picker input{width:100%}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none}
.dd div{padding:7px 12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.dd div.act,.dd div:hover{background:var(--accent2)}
.dd small{color:var(--muted)}
.badge{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;background:var(--accent2)}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.desc{background:var(--accent2);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
.desc ul{margin:6px 0 0;padding-left:20px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px}
@media (max-width:620px){.charts{grid-template-columns:1fr}.card{padding:14px}}
.chart-card{margin:0}
.cc-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;font-size:13px}
.cc-body{position:relative}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;display:none}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:var(--muted)}
a{color:var(--accent)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><span class="dot"></span><span data-i="appTitle"></span></div>
    <div class="tools">
      <div class="seg" id="modeSeg">
        <button data-mode="sdg" class="on">SDG Index</button>
        <button data-mode="pov">Poverty Index</button>
      </div>
      <div class="seg" id="langSeg">
        <button data-lang="th" class="on">ไทย</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="btn" id="btnUpdate">⟳ <span data-i="update"></span></button>
      <button class="btn" id="btnReset">↺ <span data-i="reset"></span></button>
    </div>
  </div>
</header>

<main>
  <div class="status">
    <span><span data-i="source"></span>: <b>World Bank Open Data API</b></span>
    <span><span data-i="dbUpdated"></span>: <b id="stLu">–</b></span>
    <span><span data-i="fetched"></span>: <b id="stFetched">–</b></span>
    <span id="stMsg"></span>
    <div class="progress" id="prog"><i></i></div>
  </div>

  <!-- 1. Ranking -->
  <section class="card">
    <div class="row spread">
      <div>
        <h2 id="rankTitle"></h2>
        <p class="muted" id="rankSub"></p>
      </div>
      <div class="row">
        <input type="text" id="rankFilter" data-ph="filterPh" style="width:200px">
        <button class="btn small" id="btnSort"></button>
        <button class="btn small" id="btnRankXlsx">⤓ Excel</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tablebox tall"><table id="rankTable"></table></div>
  </section>

  <!-- 2. Country picker -->
  <section class="card">
    <h2 data-i="pickTitle"></h2>
    <p class="muted" data-i="pickSub"></p>
    <div class="row" style="margin-top:12px;align-items:flex-start">
      <div class="picker" style="flex:1;min-width:260px">
        <input type="text" id="cInput" autocomplete="off" data-ph="pickPh">
        <div class="dd" id="cDD"></div>
      </div>
      <button class="btn small" id="btnTop5" data-i="addTop5"></button>
      <button class="btn small" id="btnClear" data-i="clearSel"></button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- 3. Comparison table -->
  <section class="card" id="cmpCard">
    <div class="row spread">
      <div>
        <h2 id="cmpTitle"></h2>
        <p class="muted" id="cmpSub"></p>
      </div>
      <div class="row">
        <button class="btn" id="btnXlsx">⤓ <span data-i="saveExcel"></span></button>
        <button class="btn primary" id="btnCharts">📊 <span data-i="showCharts"></span></button>
      </div>
    </div>
    <div id="cmpBody"></div>
  </section>

  <!-- 4. Charts -->
  <section class="card hidden" id="chartSec">
    <div class="row spread">
      <div>
        <h2 data-i="chartsTitle"></h2>
        <p class="muted" data-i="chartsSub"></p>
      </div>
      <button class="btn small" id="btnHideCharts" data-i="hideCharts"></button>
    </div>
    <div class="charts" id="charts" style="margin-top:14px"></div>
  </section>
</main>

<footer id="footer"></footer>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIG — แก้ไข/เพิ่มตัวชี้วัดได้ที่นี่ (ใช้รหัสตัวชี้วัดของ World Bank)
   lo = ค่าที่ได้ 0 คะแนน, hi = ค่าที่ถือว่าบรรลุเป้าหมาย (100 คะแนน)
   ===================================================================== */
const CFG = {
  WB: 'https://api.worldbank.org/v2',
  COUNTRIES_URL: 'https://restcountries.com/v3.1/all?fields=name,cca2,cca3',
  CACHE_KEY: 'sdgpov_latest_v1',
  CACHE_TTL: 6 * 3600e3,        // ข้อมูลเก่ากว่า 6 ชม. จะดึงใหม่อัตโนมัติ
  AUTO_REFRESH: 6 * 3600e3,     // ขณะเปิดหน้าไว้ ตรวจอัปเดตทุก 6 ชม.
  HIST_FROM: 1990, CHART_FROM: 2000, LOCF: 10,
  CONCURRENCY: 6, MAX_SELECT: 15
};
const UNITS = {
  pct:{en:'%',th:'%'}, p100k:{en:'per 100,000',th:'ต่อประชากร 100,000 คน'}, p1k:{en:'per 1,000',th:'ต่อ 1,000 คน'},
  yrs:{en:'years',th:'ปี'}, kgha:{en:'kg/ha',th:'กก./เฮกตาร์'}, wgi:{en:'−2.5 to 2.5',th:'−2.5 ถึง 2.5'},
  pm:{en:'µg/m³',th:'µg/m³'}, tpc:{en:'t CO₂e/capita',th:'ตัน CO₂e/คน'}, p100:{en:'per 100 people',th:'ต่อประชากร 100 คน'},
  gdp:{en:'% of GDP',th:'% ของ GDP'}, gni:{en:'% of GNI',th:'% ของ GNI'}, mj:{en:'MJ/$ GDP (PPP)',th:'MJ ต่อ GDP $1 (PPP)'},
  s100:{en:'score 0–100',th:'คะแนน 0–100'}, lpi:{en:'score 1–5',th:'คะแนน 1–5'}, gini:{en:'index 0–100',th:'ดัชนี 0–100'},
  gr:{en:'annual %',th:'% ต่อปี'}, mmr:{en:'per 100,000 live births',th:'ต่อการเกิดมีชีพ 100,000 คน'},
  adol:{en:'births per 1,000 women 15–19',th:'การเกิดต่อหญิงอายุ 15–19 ปี 1,000 คน'}
};
// I(code, ชื่ออังกฤษ, ชื่อไทย, lo = ค่าที่ได้ 0 คะแนน, hi = ค่าที่ได้ 100 คะแนน (บรรลุเป้าหมาย), หน่วย, source id)
function I(code,en,th,lo,hi,unit,src){return {code,en,th,lo,hi,unit,src};}

const SDG_DIMS = [
 {n:1,c:'#E5243B',en:'No Poverty',th:'ขจัดความยากจน',ind:[
  I('SI.POV.DDAY','Poverty headcount ratio at $3.00/day (2021 PPP)','สัดส่วนคนจนที่เส้น $3.00/วัน (PPP 2021)',70,0,'pct'),
  I('SI.POV.LMIC','Poverty headcount ratio at $4.20/day (2021 PPP)','สัดส่วนคนจนที่เส้น $4.20/วัน (PPP 2021)',85,0,'pct')]},
 {n:2,c:'#DDA63A',en:'Zero Hunger',th:'ขจัดความหิวโหย',ind:[
  I('SN.ITK.DEFC.ZS','Prevalence of undernourishment','ความชุกของภาวะขาดสารอาหาร',42,2.5,'pct'),
  I('SH.STA.STNT.ZS','Stunting, children under 5','ภาวะเตี้ยแคระแกร็นในเด็กอายุต่ำกว่า 5 ปี',50,2.5,'pct'),
  I('SH.STA.WAST.ZS','Wasting, children under 5','ภาวะผอมในเด็กอายุต่ำกว่า 5 ปี',16,0.75,'pct'),
  I('AG.YLD.CREL.KG','Cereal yield','ผลผลิตธัญพืชต่อพื้นที่',200,7000,'kgha')]},
 {n:3,c:'#4C9F38',en:'Good Health and Well-being',th:'สุขภาพและความเป็นอยู่ที่ดี',ind:[
  I('SH.STA.MMRT','Maternal mortality ratio','อัตราการตายของมารดา',814,3.4,'mmr'),
  I('SH.DYN.NMRT','Neonatal mortality rate','อัตราการตายของทารกแรกเกิด',39,1.1,'p1k'),
  I('SH.DYN.MORT','Under-5 mortality rate','อัตราการตายของเด็กอายุต่ำกว่า 5 ปี',130,2.6,'p1k'),
  I('SH.TBS.INCD','Incidence of tuberculosis','อุบัติการณ์วัณโรค',561,0,'p100k'),

  I('SH.STA.TRAF.P5','Road traffic mortality','อัตราการตายจากอุบัติเหตุทางถนน',33.7,3.2,'p100k'),
  I('SH.STA.BRTC.ZS','Births attended by skilled health staff','การคลอดโดยบุคลากรสาธารณสุขที่มีทักษะ',23,100,'pct'),
  I('SH.IMM.MEAS','Measles immunization, children 12–23 months','ความครอบคลุมวัคซีนหัด (เด็ก 12–23 เดือน)',40,100,'pct'),
  I('SH.UHC.SRVS.CV.XD','UHC service coverage index','ดัชนีความครอบคลุมหลักประกันสุขภาพถ้วนหน้า',40,100,'s100')]},

  I('SE.PRM.CMPT.ZS','Primary completion rate','อัตราการสำเร็จการศึกษาระดับประถม',40,100,'pct'),

  I('SE.ADT.LITR.ZS','Adult literacy rate','อัตราการรู้หนังสือของผู้ใหญ่',30,100,'pct'),

  I('SL.TLF.CACT.FM.ZS','Ratio of female to male labor force participation','อัตราส่วนการมีส่วนร่วมในกำลังแรงงานหญิงต่อชาย',20,100,'pct'),
  I('SP.ADO.TFRT','Adolescent fertility rate','อัตราการเกิดในวัยรุ่น',140,2.5,'adol'),
  I('SP.M18.2024.FE.ZS','Women first married by age 18','ผู้หญิงที่แต่งงานก่อนอายุ 18 ปี',60,0,'pct')]},
 {n:6,c:'#26BDE2',en:'Clean Water and Sanitation',th:'น้ำสะอาดและสุขาภิบาล',ind:[
  I('SH.H2O.BASW.ZS','Basic drinking water services','การเข้าถึงน้ำดื่มขั้นพื้นฐาน',40,100,'pct'),
  I('SH.H2O.SMDW.ZS','Safely managed drinking water','น้ำดื่มที่มีการจัดการอย่างปลอดภัย',0,100,'pct'),
  I('SH.STA.BASS.ZS','Basic sanitation services','การเข้าถึงสุขาภิบาลขั้นพื้นฐาน',10,100,'pct'),
  I('ER.H2O.FWST.ZS','Freshwater withdrawal (% of available resources)','การใช้น้ำจืด (% ของทรัพยากรน้ำที่มี)',100,12.5,'pct')]},
 {n:7,c:'#FCC30B',en:'Affordable and Clean Energy',th:'พลังงานสะอาดที่ทุกคนเข้าถึงได้',ind:[

  I('EG.EGY.PRIM.PP.KD','Energy intensity of primary energy','ความเข้มข้นการใช้พลังงานปฐมภูมิ',12,2,'mj')]},
 {n:8,c:'#A21942',en:'Decent Work and Economic Growth',th:'งานที่มีคุณค่าและการเติบโตทางเศรษฐกิจ',ind:[

 {n:9,c:'#FD6925',en:'Industry, Innovation and Infrastructure',th:'อุตสาหกรรม นวัตกรรม และโครงสร้างพื้นฐาน',ind:[

  footer:'Data is fetched live from the World Bank Open Data API (World Development Indicators, Poverty & Inequality Platform, Worldwide Governance Indicators) and the country list from REST Countries every time the page opens. Data older than 6 hours is re-fetched automatically, and the page checks again every 6 hours while open — when the source database changes, the numbers here change with it. The SDG Index and Poverty Index on this page are computed with an SDSN Sustainable Development Report–style method (each indicator rescaled to 0–100 between a lower bound and a target, averaged within each dimension, then across dimensions) from World Bank indicators, so they may differ from the official SDR ranking.'
 }
};
const t = (k, vars) => { let s = (TX[state.lang][k] ?? k); if (vars) for (const v in vars) s = s.replace('{'+v+'}', vars[v]); return s; };

  mode:'sdg', lang:'th', countries:[], byIso:{}, wbSet:new Set(),

  selected:[], hist:{}, histLoaded:{}, chartsOn:false, charts:{}, lbl:{}, opt:{},

const PALETTE = ['#0b6e8a','#e4572e','#2e9d5b','#8e44ad','#f0a202','#d81b60','#17a2b8','#6d4c41','#3949ab','#7cb342','#ff7043','#546e7a','#c2185b','#00897b','#5e35b1'];

/* ============================== HELPERS ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
const clamp = v => Math.max(0, Math.min(100, v));
function fmt(v, d){ if (v == null || isNaN(v)) return '–'; const a = Math.abs(v); const dd = d != null ? d : (a >= 1000 ? 0 : a >= 100 ? 1 : 2); return Number(v).toLocaleString('en-US',{maximumFractionDigits:dd}); }
const fs = v => v == null ? '–' : Number(v).toFixed(1);
const cls = s => s == null ? 'n' : s >= 80 ? 'g' : s >= 65 ? 'y' : s >= 50 ? 'o' : 'r';
const flag = cc => (cc && /^[A-Z]{2}$/.test(cc)) ? String.fromCodePoint(...[...cc].map(c => 127397 + c.charCodeAt(0))) : '🏳️';
const cName = iso => { const c = state.byIso[iso]; return c ? (state.lang === 'th' ? c.th : c.en) : iso; };
const dimName = d => state.lang === 'th' ? d.th : d.en;
const dimShort = d => state.mode === 'sdg' ? 'SDG ' + d.n : (state.lang === 'th' ? d.sth : d.sen);
const indName = x => state.lang === 'th' ? x.th : x.en;
const unitName = x => (UNITS[x.unit] || {})[state.lang] || '';
const norm = (x, v) => (v == null || isNaN(v)) ? null : clamp((v - x.lo) / (x.hi - x.lo) * 100);
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 3500); }
function progress(f, msg){ const p = $('#prog'); if (f == null){ p.style.display = 'none'; $('#stMsg').textContent = ''; return; } p.style.display = 'block'; p.firstElementChild.style.width = Math.round(f*100) + '%'; if (msg) $('#stMsg').textContent = msg; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function today(){ return new Date().toISOString().slice(0,10); }

async function getJSON(url, tries = 3, timeout = 45000){
  for (let i = 0; i < tries; i++){
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout);
      const r = await fetch(url, {signal: ctl.signal}); clearTimeout(tm);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { if (i === tries - 1) throw e; await new Promise(r => setTimeout(r, 900 * (i + 1))); }
  }
}
async function wbAll(url, tries, timeout){
  const j = await getJSON(url + '&page=1', tries, timeout);
  if (!Array.isArray(j) || !j[0] || j[0].message) return {rows: [], lu: null};
  let rows = j[1] || []; const pages = j[0].pages || 1;
  for (let p = 2; p <= pages; p++){ const k = await getJSON(url + '&page=' + p); if (Array.isArray(k) && k[1]) rows = rows.concat(k[1]); }
  return {rows, lu: j[0].lastupdated || null};
}
async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while (i < items.length){ const k = i++; await fn(items[k], k); } })); }
function uniqueInds(){ const m = new Map(); for (const md of Object.values(MODES)) for (const d of md.dims) for (const x of d.ind) if (!m.has(x.code)) m.set(x.code, x); return [...m.values()]; }
const srcQ = x => x.src ? '&source=' + x.src : '';

/* ============================== COUNTRIES ============================== */
async function loadCountries(){
  let dnTh = null, dnEn = null;
  try { dnTh = new Intl.DisplayNames(['th'], {type:'region'}); dnEn = new Intl.DisplayNames(['en'], {type:'region'}); } catch(e){}
  const [rc, wb] = await Promise.allSettled([getJSON(CFG.COUNTRIES_URL), wbAll(CFG.WB + '/country?format=json&per_page=400')]);
  const by = {};
  if (rc.status === 'fulfilled' && Array.isArray(rc.value)){
    for (const c of rc.value){
      let iso = c.cca3; if (iso === 'UNK') iso = 'XKX';
      by[iso] = {iso, cc: c.cca2, en: c.name?.common || iso};
    }
  }
  if (wb.status === 'fulfilled'){
    for (const c of wb.value.rows){
      if (!c.region || c.region.id === 'NA') continue;   // ตัดกลุ่มประเทศ/ภูมิภาค
      state.wbSet.add(c.id);
      if (!by[c.id]) by[c.id] = {iso: c.id, cc: /^[A-Z]{2}$/.test(c.iso2Code) ? c.iso2Code : '', en: c.name};
    }
  }
  for (const iso in by){
    const c = by[iso];
    let th = null; try { th = c.cc && dnTh ? dnTh.of(c.cc) : null; } catch(e){}
    c.th = (th && th !== c.cc) ? th : c.en;
    if (!c.en && dnEn && c.cc) c.en = dnEn.of(c.cc);
  }
  state.byIso = by;
  state.countries = Object.values(by).sort((a, b) => a.en.localeCompare(b.en));
  if (!state.wbSet.size) state.countries.forEach(c => state.wbSet.add(c.iso));
}

/* ============================== LATEST DATA ============================== */
function readCache(){ try { const s = localStorage.getItem(CFG.CACHE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function writeCache(p){ try { localStorage.setItem(CFG.CACHE_KEY, JSON.stringify(p)); } catch(e){} }

async function fetchLatest(x){
  const {rows, lu} = await wbAll(`${CFG.WB}/country/all/indicator/${x.code}?format=json&mrnev=1&per_page=20000${srcQ(x)}`);
  const out = {};
  for (const r of rows) if (r.value != null && r.countryiso3code) out[r.countryiso3code] = [r.value, parseInt(r.date)];
  return {data: out, lu};
}

async function loadLatest(force){
  if (state.loading) return;
  const cached = readCache();
  if (cached && !force && !Object.keys(state.latest).length){ applyLatest(cached); if (Date.now() - cached.t < CFG.CACHE_TTL) return; }
  state.loading = true; progress(0, t('loading'));
  const inds = uniqueInds(); const latest = {}; let lu = null, fails = 0, done = 0;
  await pool(inds, CFG.CONCURRENCY, async x => {
    try { const r = await fetchLatest(x); latest[x.code] = r.data; if (r.lu && (!lu || r.lu > lu)) lu = r.lu; }
    catch(e){ fails++; latest[x.code] = state.latest[x.code] || {}; }
    progress(++done / inds.length, t('loading') + ` ${done}/${inds.length}`);
  });
  const prevSig = signature(state.latest);
  const payload = {t: Date.now(), latest, lu};
  writeCache(payload);
  state.loading = false; progress(null);
  const changed = prevSig && prevSig !== signature(latest);
  state.hist = {}; state.histLoaded = {};
  applyLatest(payload);
  if (fails) toast(t('fetchFail')); else if (changed) toast(t('dataChanged')); else if (force) toast(t('updated'));
  if (state.chartsOn) showCharts();
}
function signature(latest){ const k = Object.keys(latest || {}); if (!k.length) return null; let s = 0; for (const c of k) for (const i in latest[c]){ s += latest[c][i][0] * 1e-3 + latest[c][i][1]; } return k.length + ':' + s.toFixed(3); }

function applyLatest(p){
  state.latest = p.latest || {}; state.lastUpdated = p.lu; state.fetchedAt = p.t;
  computeAll(); renderAll();
}

/* ============================== SCORING ============================== */
function scoreFor(mode, getter){
  const M = MODES[mode]; let sum = 0, cnt = 0, maxY = 0;
  const dims = M.dims.map(d => {
    const inds = d.ind.map(x => { const o = getter(x.code); if (!o) return {v:null,y:null,s:null}; if (o[1] > maxY) maxY = o[1]; return {v:o[0], y:o[1], s:norm(x, o[0])}; });
    const ss = inds.map(z => z.s).filter(z => z != null);
    const score = ss.length ? avg(ss) : null; if (score != null){ sum += score; cnt++; }
    return {score, inds};
  });
  return {index: cnt >= M.minDims ? sum / cnt : null, dims, nDims: cnt, year: maxY || null};
}
function computeAll(){
  for (const mode of ['sdg','pov']){
    const sc = {};
    for (const c of state.countries) sc[c.iso] = scoreFor(mode, code => state.latest[code]?.[c.iso] || null);
    state.scores[mode] = sc;
    state.rank[mode] = Object.keys(sc).filter(i => sc[i].index != null).sort((a, b) => sc[b].index - sc[a].index);
  }
}
const rankOf = (iso, mode = state.mode) => { const i = state.rank[mode].indexOf(iso); return i < 0 ? null : i + 1; };

  const head = `<thead><tr><th class="num">${t('rank')}</th><th>${t('country')}</th><th class="num">${t('score')}</th><th class="num">${t('dataYear')}</th>${M.dims.map(d => `<th title="${esc(dimName(d))}" style="text-align:center;padding:7px 2px"><span class="sw" style="background:${d.c};margin:0"></span><div style="font-size:11px">${esc(state.mode === 'sdg' ? d.n : dimShort(d))}</div></th>`).join('')}</tr></thead>`;

let ddIdx = -1;
function matches(q){
  q = q.trim().toLowerCase(); if (!q) return state.countries;
  const starts = state.countries.filter(c => c.en.toLowerCase().startsWith(q) || c.th.toLowerCase().startsWith(q) || c.iso.toLowerCase() === q);

  return state.countries.filter(c => c.en.toLowerCase().includes(q) || c.th.toLowerCase().includes(q));
}
function renderDD(){

}
function toggleCountry(iso, onlyAdd){

function renderCompare(){
  const M = MODES[state.mode], sel = state.selected;

  const sc = state.scores[state.mode];

function describe(){
  const M = MODES[state.mode], sc = state.scores[state.mode], sel = state.selected, th = state.lang === 'th';
  const nR = state.rank[state.mode].length;
  const general = state.mode === 'sdg'
    ? (th ? `<p style="margin:6px 0 0">ตารางนี้แสดงผลการดำเนินงานตามเป้าหมายการพัฒนาที่ยั่งยืน (SDGs) ทั้ง 17 เป้าหมาย แถวสีพื้นคือ "มิติ" (เป้าหมาย SDG) และแถวย่อยคือ "ดัชนีชี้วัด" ในแต่ละมิติ แต่ละช่องแสดง <b>ค่าที่วัดได้จริง</b> ตามด้วย (ปีของข้อมูล) และ <b>คะแนนมาตรฐาน 0–100</b> ซึ่ง 100 หมายถึงบรรลุค่าเป้าหมาย คะแนนมิติ = ค่าเฉลี่ยของคะแนนตัวชี้วัด และคะแนน SDG Index = ค่าเฉลี่ยของคะแนนทุกมิติที่มีข้อมูล (ต้องมีอย่างน้อย ${M.minDims} จาก 17 มิติจึงจะจัดอันดับ)</p>`
          : `<p style="margin:6px 0 0">This table shows performance on all 17 Sustainable Development Goals. Shaded rows are the <i>dimensions</i> (SDGs); the rows beneath are the <i>indicators</i> used for each. Each cell gives the <b>measured value</b>, its (data year), and a <b>standardised score 0–100</b>, where 100 means the target is reached. A goal score is the mean of its indicator scores, and the SDG Index is the mean of all goal scores with data (at least ${M.minDims} of 17 goals are needed for a rank).</p>`)
    : (th ? `<p style="margin:6px 0 0">ตารางนี้แสดงดัชนีความยากจน (Poverty Index) ใน 7 มิติ ได้แก่ ความยากจนด้านรายได้ ความลึกของความยากจน ความยากจนตามเส้นระดับชาติ ความยากจนหลายมิติ (MPI) ความเหลื่อมล้ำ มาตรฐานการครองชีพ และการศึกษา/โภชนาการ แต่ละช่องแสดง <b>ค่าที่วัดได้จริง</b> (ปีข้อมูล) และ <b>คะแนน 0–100</b> โดย <b>100 = ความยากจน/การขาดแคลนต่ำที่สุด</b> ค่าดัชนีรวม = ค่าเฉลี่ยทุกมิติที่มีข้อมูล (ต้องมีอย่างน้อย ${M.minDims} มิติ) อันดับ 1 คือประเทศที่มีความยากจนต่ำที่สุด</p>`
          : `<p style="margin:6px 0 0">This table shows the Poverty Index across 7 dimensions: monetary poverty, depth of poverty, national & societal poverty, multidimensional poverty (MPI), inequality, living standards, and education/nutrition. Each cell gives the <b>measured value</b> (data year) and a <b>0–100 score</b>, where <b>100 = lowest poverty/deprivation</b>. The overall index is the mean of all dimensions with data (at least ${M.minDims} required). Rank 1 is the country with the least poverty.</p>`);
  const items = [];
  const ranked = sel.filter(i => sc[i]?.index != null).sort((a, b) => sc[b].index - sc[a].index);
  if (ranked.length > 1){
    const a = ranked[0], z = ranked[ranked.length - 1];
    items.push(th ? `คะแนนรวมสูงสุดในกลุ่มที่เลือก: <b>${esc(cName(a))}</b> (${fs(sc[a].index)}, อันดับ ${rankOf(a)} จาก ${nR}) ต่ำสุด: <b>${esc(cName(z))}</b> (${fs(sc[z].index)}, อันดับ ${rankOf(z)})`
                  : `Highest overall score in this group: <b>${esc(cName(a))}</b> (${fs(sc[a].index)}, rank ${rankOf(a)} of ${nR}); lowest: <b>${esc(cName(z))}</b> (${fs(sc[z].index)}, rank ${rankOf(z)}).`);
  }
  for (const i of sel){
    const s = sc[i]; if (!s || !s.nDims){ items.push(`<b>${esc(cName(i))}</b>: ${t('noData')}`); continue; }
    const ds = s.dims.map((d, k) => ({k, v: d.score})).filter(o => o.v != null).sort((a, b) => b.v - a.v);
    const best = ds[0], worst = ds[ds.length - 1];
    items.push(th ? `<b>${esc(cName(i))}</b>: คะแนนรวม ${fs(s.index)} — มิติที่โดดเด่นที่สุดคือ "${esc(dimName(M.dims[best.k]))}" (${fs(best.v)}) และมิติที่ต้องพัฒนามากที่สุดคือ "${esc(dimName(M.dims[worst.k]))}" (${fs(worst.v)}) มีข้อมูล ${s.nDims}/${M.dims.length} มิติ`
                  : `<b>${esc(cName(i))}</b>: overall ${fs(s.index)} — strongest dimension "${esc(dimName(M.dims[best.k]))}" (${fs(best.v)}), weakest "${esc(dimName(M.dims[worst.k]))}" (${fs(worst.v)}); data for ${s.nDims}/${M.dims.length} dimensions.`);
  }
  return general + `<ul>${items.map(x => `<li>${x}</li>`).join('')}</ul>`;
}

/* ============================== HISTORY ============================== */
async function ensureHist(mode, isos, onProg){
  const wbIsos = isos.filter(i => state.wbSet.has(i)); if (!wbIsos.length) return;
  const inds = [...new Map(MODES[mode].dims.flatMap(d => d.ind).map(x => [x.code, x])).values()];
  const y = new Date().getFullYear();
  const tasks = inds.map(x => ({x, need: wbIsos.filter(i => !(state.histLoaded[x.code] && state.histLoaded[x.code].has(i)))})).filter(o => o.need.length);
  if (!tasks.length) return;
  let done = 0; progress(0, t('loadingHist'));
  await pool(tasks, 8, async ({x, need}) => {
    try {
      const {rows} = await wbAll(`${CFG.WB}/country/${need.join(';')}/indicator/${x.code}?format=json&per_page=20000&date=${CFG.HIST_FROM}:${y}${srcQ(x)}`, 2, 20000);
      const h = state.hist[x.code] || (state.hist[x.code] = {});
      need.forEach(i => h[i] = []);
      for (const r of rows){ if (r.value == null || !r.countryiso3code) continue; (h[r.countryiso3code] || (h[r.countryiso3code] = [])).push([parseInt(r.date), r.value]); }
      need.forEach(i => h[i].sort((a, b) => a[0] - b[0]));
      const s = state.histLoaded[x.code] || (state.histLoaded[x.code] = new Set()); need.forEach(i => s.add(i));
    } catch(e){ const h = state.hist[x.code] || (state.hist[x.code] = {}); need.forEach(i => { if (!h[i]) h[i] = []; }); }
    progress(++done / tasks.length, t('loadingHist') + ` ${done}/${tasks.length}`);
    if (onProg) onProg(done, tasks.length);
  });
  progress(null);
}
function histAt(code, iso, Y, locf){ const a = state.hist[code]?.[iso]; if (!a) return null; let r = null; for (const [yr, v] of a){ if (yr > Y) break; if (Y - yr <= locf) r = [v, yr]; } return r; }
function yearsRange(){
  let maxY = CFG.CHART_FROM;
  for (const d of MODES[state.mode].dims) for (const x of d.ind) for (const i of state.selected){ const a = state.hist[x.code]?.[i]; if (a && a.length) maxY = Math.max(maxY, a[a.length - 1][0]); }
  const ys = []; for (let y = CFG.CHART_FROM; y <= maxY; y++) ys.push(y); return ys;
}

const LBL_DEFAULT = {overall:'all', dims:'none', radar:'none', trend:'latest', dimTrend:'latest', indTrend:'latest', stack:'none', world:'all', polar:'all', raw:'all'};

function lastIdx(arr){ for (let k = arr.length - 1; k >= 0; k--){ const v = arr[k]; if (v != null && !(typeof v === 'object' && v.y == null)) return k; } return -1; }
function labelVisible(id, ctx){
  const L = state.lbl[id] || {mode: LBL_DEFAULT[id], n: 10};
  const v = ctx.dataset.data[ctx.dataIndex];
  if (v == null || (typeof v === 'object' && v.y == null) || L.mode === 'none') return false;
  if (ctx.dataset._noLabel) return false;
  if (L.mode === 'all') return true;
  if (L.mode === 'latest') return ctx.dataIndex === lastIdx(ctx.dataset.data);
  if (L.mode === 'every'){ const n = Math.max(1, parseInt(L.n) || 1); return ctx.dataIndex % n === 0 || ctx.dataIndex === lastIdx(ctx.dataset.data); }
  return false;
}
function dl(id, extra){ return Object.assign({display: ctx => labelVisible(id, ctx), formatter: v => typeof v === 'object' && v ? fs(v.y) : fmt(v, Math.abs(v) >= 100 ? 0 : 1), color: cssVar('--text'), font:{size:10, weight:'600'}, anchor:'end', align:'end', offset:2, clamp:true}, extra || {}); }

let chartRun = 0;
async function showCharts(){
  if (!state.selected.length){ toast(t('selectFirst')); return; }
  const run = ++chartRun;
  state.chartsOn = true; $('#chartSec').classList.remove('hidden');
  const need = histMissing(state.mode, state.selected);
  state.histPending = need;
  renderCharts();                                   // กราฟจากข้อมูลล่าสุดแสดงทันที
  if (!need) return;
  await ensureHist(state.mode, state.selected, (d, n) => {
    if (run !== chartRun) return;
    document.querySelectorAll('.histwait b').forEach(b => b.textContent = `${d}/${n}`);
  });
  if (run !== chartRun || !state.chartsOn) return;
  state.histPending = false;
  renderCharts();                                   // เติมกราฟแนวโน้มรายปี
}
function histMissing(mode, isos){
  const w = isos.filter(i => state.wbSet.has(i));
  return MODES[mode].dims.some(d => d.ind.some(x => w.some(i => !(state.histLoaded[x.code] && state.histLoaded[x.code].has(i)) && !(state.hist[x.code] && state.hist[x.code][i]))));
}
function renderCharts(){
  Object.values(state.charts).forEach(c => c.destroy()); state.charts = {};
  if (!window.Chart){ $('#charts').innerHTML = `<div class="empty">${state.lang === 'th' ? 'โหลดไลบรารีกราฟ (Chart.js) ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต แล้วกดรีเฟรชหน้า' : 'Could not load the chart library (Chart.js) — check your connection and reload the page.'}</div>`; return; }
  const specs = chartSpecs(), box = $('#charts');
  box.innerHTML = specs.map(s => {
    const L = state.lbl[s.id] || (state.lbl[s.id] = {mode: LBL_DEFAULT[s.id], n: s.time ? 5 : 2});
    return `<div class="card chart-card" data-cid="${s.id}">
      <h3>${esc(t('c_' + s.id))}</h3><p class="muted">${esc(t('c_' + s.id + '_d'))}</p>
      <div class="cc-ctrl">${s.extra ? s.extra() : ''}
        <label>${t('labels')} <select data-lbl>
          <option value="none">${t('lblNone')}</option><option value="all">${t('lblAll')}</option><option value="every">${t('lblEvery')}</option>${s.time ? `<option value="latest">${t('lblLatest')}</option>` : ''}
        </select></label>
        <label class="nwrap" style="${L.mode === 'every' ? '' : 'display:none'}">${t('every')} <input type="number" min="1" max="50" value="${L.n}" data-n></label>
        <button class="btn small" data-dl>⤓ ${t('dlPng')}</button>
      </div>
      <div class="cc-body" style="height:${s.h}px"><canvas></canvas></div></div>`;
  }).join('');
  specs.forEach(s => {
    const card = box.querySelector(`[data-cid="${s.id}"]`);
    card.querySelector('[data-lbl]').value = state.lbl[s.id].mode;
    card.querySelectorAll('[data-opt]').forEach(el => { const key = s.id + '_' + el.dataset.opt; if (state.opt[key] != null) el.value = state.opt[key]; else state.opt[key] = el.value; });
    card._spec = s;
    if (s.time && state.histPending){
      card.querySelector('.cc-body').innerHTML = `<div class="empty histwait">⏳ ${t('loadingHist')} <b></b></div>`;
      return;
    }
    buildChart(s, card);
  });
}
function buildChart(s, card){
  if (state.charts[s.id]){ state.charts[s.id].destroy(); delete state.charts[s.id]; }
  card._spec = s;
  try {
    const cfg = s.build(t('c_' + s.id));
    state.charts[s.id] = new Chart(card.querySelector('canvas'), cfg);
  } catch(e){
    console.error('chart', s.id, e);
    card.querySelector('.cc-body').innerHTML = `<div class="empty">${t('noSeries')}<br><small>${esc(e.message)}</small></div>`;
  }
}

cInput.addEventListener('focus', () => { ddIdx = 0; renderDD(); });
cInput.addEventListener('keydown', e => {
  const items = [...$('#cDD').querySelectorAll('[data-iso]')];
  if (e.key === 'ArrowDown'){ ddIdx = Math.min(items.length - 1, ddIdx + 1); renderDD(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ ddIdx = Math.max(0, ddIdx - 1); renderDD(); e.preventDefault(); }
  else if (e.key === 'Enter' && items[ddIdx]){ toggleCountry(items[ddIdx].dataset.iso, true); cInput.value = ''; ddIdx = 0; renderDD(); e.preventDefault(); }
  else if (e.key === 'Escape'){ $('#cDD').style.display = 'none'; }
});
$('#cDD').addEventListener('mousedown', e => { const d = e.target.closest('[data-iso]'); if (!d) return; e.preventDefault(); toggleCountry(d.dataset.iso); cInput.value = ''; renderDD(); cInput.focus(); });
document.addEventListener('click', e => { if (!e.target.closest('.picker')) $('#cDD').style.display = 'none'; });
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) toggleCountry(b.dataset.rm); });
$('#btnClear').addEventListener('click', () => { state.selected = []; onSelectionChange(); });
$('#btnTop5').addEventListener('click', () => { state.rank[state.mode].slice(0, 5).forEach(i => { if (!state.selected.includes(i) && state.selected.length < CFG.MAX_SELECT) state.selected.push(i); }); onSelectionChange(); });
$('#btnXlsx').addEventListener('click', exportCompare);
$('#btnCharts').addEventListener('click', () => { if (!state.selected.length){ toast(t('selectFirst')); $('#cInput').focus(); return; } showCharts(); setTimeout(() => $('#chartSec').scrollIntoView({behavior:'smooth', block:'start'}), 50); });
$('#btnHideCharts').addEventListener('click', () => { chartRun++; state.chartsOn = false; $('#chartSec').classList.add('hidden'); Object.values(state.charts).forEach(c => c.destroy()); state.charts = {}; });

$('#charts').addEventListener('change', e => {
  const card = e.target.closest('[data-cid]'); if (!card) return; const id = card.dataset.cid; const L = state.lbl[id];
  if (e.target.matches('[data-lbl]')){ L.mode = e.target.value; card.querySelector('.nwrap').style.display = L.mode === 'every' ? '' : 'none'; state.charts[id]?.update(); }
  else if (e.target.matches('[data-n]')){ L.n = e.target.value; state.charts[id]?.update(); }
  else if (e.target.matches('[data-opt]')){ state.opt[id + '_' + e.target.dataset.opt] = e.target.value; buildChart(card._spec, card); }
});
$('#charts').addEventListener('input', e => { if (!e.target.matches('[data-n]')) return; const id = e.target.closest('[data-cid]').dataset.cid; state.lbl[id].n = e.target.value; state.charts[id]?.update(); });
$('#charts').addEventListener('click', e => {
  if (!e.target.closest('[data-dl]')) return; const id = e.target.closest('[data-cid]').dataset.cid; const ch = state.charts[id]; if (!ch) return;
  const a = document.createElement('a'); a.href = ch.toBase64Image('image/png', 1); a.download = `${state.mode}_${id}_${today()}.png`; document.body.appendChild(a); a.click(); a.remove();
});

document.addEventListener('visibilitychange', () => { if (!document.hidden && state.fetchedAt && Date.now() - state.fetchedAt > CFG.CACHE_TTL) loadLatest(true); });
setInterval(() => loadLatest(true), CFG.AUTO_REFRESH);

/* ============================== INIT ============================== */
(async function init(){
  try { const l = localStorage.getItem('sdgpov_lang'); if (l === 'en' || l === 'th') state.lang = l; } catch(e){}
  renderStatic(); renderRanking(); renderCompare();
  progress(0.02, t('loading'));
  await loadCountries();
  await loadLatest(false);
})();
</script>
</body>
</html>
